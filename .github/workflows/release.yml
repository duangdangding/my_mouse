name: 发布 Windows 安装包与更新

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run release:check -- "${{ github.ref_name }}"
        shell: bash
      - run: npm run build
      - run: npm test
      - run: npm run clippy
      - run: npm run tauri build -- --bundles nsis
      - name: 生成更新清单
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $directory = "src-tauri/target/release/bundle/nsis"
          $archive = Get-ChildItem $directory -Filter "*.nsis.zip" | Select-Object -First 1
          if (-not $archive) { throw "找不到 NSIS 更新压缩包" }
          $signaturePath = "$($archive.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw "找不到更新签名" }
          $manifest = @{
            version = $version
            notes = "鼠标流光 $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content $signaturePath -Raw).Trim()
                url = "https://github.com/duangdangding/my_mouse/releases/download/${{ github.ref_name }}/$($archive.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content latest.json -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json
          generate_release_notes: true
