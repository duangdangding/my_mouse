name: 发布桌面安装包与更新

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run release:check -- "${{ github.ref_name }}"
        shell: bash
      - run: npm run build
      - run: npm test
      - run: npm run clippy
      - run: npm run tauri build -- --bundles nsis
      - name: 生成 Windows 更新清单
        shell: bash
        run: node scripts/update-manifest.mjs create "${{ github.ref_name }}" windows-x86_64 src-tauri/target/release/bundle/nsis manifest-windows-x86_64.json
      - name: 上传 Windows 发布产物
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
            manifest-windows-x86_64.json

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run release:check -- "${{ github.ref_name }}"
      - run: npm run build
      - run: npm test
      - run: npm run clippy
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: 生成 macOS 更新清单
        run: node scripts/update-manifest.mjs create "${{ github.ref_name }}" "${{ matrix.platform }}" "src-tauri/target/${{ matrix.target }}/release/bundle/macos" "manifest-${{ matrix.platform }}.json"
      - name: 上传 macOS 发布产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig
            manifest-${{ matrix.platform }}.json

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: .generated/release
          merge-multiple: true
      - name: 合并三平台更新清单
        run: node scripts/update-manifest.mjs merge .generated/release .generated/release/latest.json
      - name: 准备 Release 说明
        run: node scripts/update-manifest.mjs notes "${{ github.ref_name }}" .generated/RELEASE_NOTES.md
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .generated/RELEASE_NOTES.md
          files: |
            .generated/release/*.exe
            .generated/release/*.nsis.zip
            .generated/release/*.dmg
            .generated/release/*.app.tar.gz
            .generated/release/*.sig
            .generated/release/latest.json
